job: extension
config:
  name: "mkw16_v1"
  process:
    - type: "sd_trainer"
      training_folder: "C:/Claude Code Projects/lora-trainer/output"
      device: cuda:0
      trigger_word: "mkw16"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 8
        push_to_hub: false
      datasets:
        - folder_path: "C:/Claude Code Projects/lora-trainer/dataset/train"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          flip_x: true
          resolution: [512, 768]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "weighted"
        optimizer: "adamw8bit"
        lr: 1e-4
        unload_text_encoder: false
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16
      model:
        arch: "flux2_klein_4b"
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        quantize: true
        quantize_te: true
        qtype: "qfloat8"
        low_vram: true
        model_kwargs:
          match_target_res: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 0
        width: 768
        height: 768
        prompts:
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a soldier in red-lacquered iron plate armour with a brass helmet, holding a long rifle."
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a young woman courier in a brown leather coat with brass goggles on her forehead, holding a large wrench."
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a tall bark-skinned marsh dweller with moss on the shoulders, holding a staff tipped with a teal glass shard."
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a veiled fire priest in grey and white robes, holding a lantern of flame."
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a walking steam boiler machine on two jointed iron legs with an enclosed cab and a round teal porthole."
          - "mkw16 pixel art, a 16-bit game character sprite, standing, three-quarter view, plain navy background, a stern grey-haired officer in a long red greatcoat with brass epaulettes, holding a sabre."
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 28
meta:
  name: "mkw16_v1"
  version: "1.0"
